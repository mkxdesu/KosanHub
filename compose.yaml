services:
  # ==========================================
  # APPLICATION
  # ==========================================
  app:
    image: ${DOCKER_IMAGE:-renanthera/kosanhub:latest}
    build:
      context: .
      target: production

    container_name: kosanhub-app
    restart: unless-stopped

    command:
      [
        "php",
        "artisan",
        "serve",
        "--host=0.0.0.0",
        "--port=8000",
        "--no-reload"
      ]

    ports:
      - "${APP_PORT:-8000}:8000"

    env_file:
      - path: .env
        required: false

    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY must be provided}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kosanhub}
      DB_USERNAME: ${DB_USERNAME:-kosanhub}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      QUEUE_CONNECTION: redis
      REDIS_QUEUE_RETRY_AFTER: 180

      RUN_MIGRATIONS: "true"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/up || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - frontend
      - backend

  # ==========================================
  # QUEUE WORKER
  # ==========================================
  worker:
    image: ${DOCKER_IMAGE:-renanthera/kosanhub:latest}

    container_name: kosanhub-worker
    restart: unless-stopped

    command:
      [
        "php",
        "artisan",
        "queue:work",
        "redis",
        "--sleep=3",
        "--tries=3",
        "--timeout=120"
      ]

    env_file:
      - path: .env
        required: false

    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY must be provided}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kosanhub}
      DB_USERNAME: ${DB_USERNAME:-kosanhub}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      QUEUE_CONNECTION: redis
      REDIS_QUEUE_RETRY_AFTER: 180

      RUN_MIGRATIONS: "false"

    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pgrep -f 'artisan queue:work' >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - backend

  # ==========================================
  # MYSQL DATABASE
  # ==========================================
  db:
    image: mysql:8.0

    container_name: kosanhub-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kosanhub}
      MYSQL_USER: ${DB_USERNAME:-kosanhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be provided}

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root --password=\"$${MYSQL_ROOT_PASSWORD}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - backend

  # ==========================================
  # REDIS MESSAGE BROKER
  # ==========================================
  redis:
    image: redis:7-alpine

    container_name: kosanhub-redis
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

# ==========================================
# NETWORKS
# ==========================================
networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true

# ==========================================
# PERSISTENT VOLUME
# ==========================================
volumes:
  db_data: